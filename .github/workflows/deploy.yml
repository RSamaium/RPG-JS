name: Deploy to VPS

on:
  push:
    branches:
      - v5
    paths-ignore:
      - "docs/**"
      - "*.md"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t rpgjs-game:latest .

      - name: Save Docker image as tarball
        run: |
          docker save rpgjs-game:latest | gzip > rpgjs-game.tar.gz

      - name: Copy image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: rpgjs-game.tar.gz
          target: /tmp

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            docker load < /tmp/rpgjs-game.tar.gz
            docker stop rpgjs-game 2>/dev/null || true
            docker rm rpgjs-game 2>/dev/null || true
            docker run -d \
              --name rpgjs-game \
              --restart unless-stopped \
              -p 3000:3000 \
              rpgjs-game:latest
            rm -f /tmp/rpgjs-game.tar.gz
            docker image prune -f
