name: VPS Deployment

on:
  push:
    branches:
      - v5
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

jobs:
  deploy-docker:
    name: Deploy via Docker (GHCR)
    runs-on: ubuntu-latest
    if: github.repository == 'OuroborosCollective/ARE-LOGIC-RPG-JS-2D_Mmorpg'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rpg-js:latest
            ghcr.io/${{ github.repository_owner }}/rpg-js:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS via SSH (Docker)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/rpg-js:latest
            docker stop rpg-js || true
            docker rm rpg-js || true
            docker run -d --name rpg-js \
              -p 3000:3000 \
              --restart always \
              ghcr.io/${{ github.repository_owner }}/rpg-js:latest
            docker image prune -f

  deploy-node:
    name: Deploy via Node.js (PM2)
    runs-on: ubuntu-latest
    if: github.repository == 'OuroborosCollective/ARE-LOGIC-RPG-JS-2D_Mmorpg'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Deploy to VPS via SSH (Node.js)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /var/www/rpg-js || (mkdir -p /var/www/rpg-js && cd /var/www/rpg-js && git clone -b v5 https://github.com/${{ github.repository }} .)
            git pull origin v5
            pnpm install --no-frozen-lockfile
            pnpm build
            pm2 restart rpg-js || pm2 start dist/server/express.js --name rpg-js
